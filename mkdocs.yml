site_name: ClimaDC
site_description: Causal offline evaluation and verifiable replay for climate-aware data centers
site_url: https://hai-qq.github.io/climadc/
repo_url: https://github.com/Hai-qq/climadc
repo_name: Hai-qq/climadc
strict: true
exclude_docs: |
  superpowers/
theme:
  name: material
  language: en
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Evidence:
      - Evidence model: evidence-model.md
      - Benchmark evidence levels: benchmark-evidence-levels.md
      - v0.3 migration: migration-v0.3.md
      - v0.3 baseline audit: audits/v0.3-baseline-audit.md
  - Concepts:
      - Time semantics: concepts/time-semantics.md
      - Engineering inputs: concepts/engineering-inputs.md
      - Engineering replay kernel: concepts/replay-kernel.md
      - Replay sensitivity and robustness suites: concepts/robustness-suites.md
      - Great Britain reference replay: concepts/reference-replay.md
      - Trace-driven benchmark preparation: concepts/trace-driven-benchmarks.md
      - Read-only integrations: concepts/read-only-integrations.md
  - Design:
      - v0.2 engineering replay: design/v0.2-engineering-replay.md
      - ADR 0001 - causal time spine: adr/0001-causal-time-spine.md
      - ADR 0002 - artifact schema v2: adr/0002-artifact-schema-v2.md
      - ADR 0003 - versioned objectives: adr/0003-versioned-objectives.md
      - ADR 0004 - evidence levels and suites: adr/0004-evidence-levels-and-suites.md
      - ADR 0005 - foreign trace conversion boundary: adr/0005-google-trace-conversion-boundary.md
  - API:
      - Stability: api-stability.md
      - Reference: api/index.md
  - 简体中文:
      - 首页: zh-CN/index.md
      - 快速开始: zh-CN/quickstart.md
      - 时间语义: zh-CN/concepts/time-semantics.md
      - 工程输入契约: zh-CN/concepts/engineering-inputs.md
      - 工程回放内核: zh-CN/concepts/replay-kernel.md
      - 回放敏感性与稳健性套件: zh-CN/concepts/robustness-suites.md
      - 英国参考回放: zh-CN/concepts/reference-replay.md
      - 轨迹驱动 Benchmark 准备: zh-CN/concepts/trace-driven-benchmarks.md
      - 只读生态适配器: zh-CN/concepts/read-only-integrations.md
      - v0.2 工程回放设计: zh-CN/design/v0.2-engineering-replay.md
