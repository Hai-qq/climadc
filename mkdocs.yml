site_name: ClimaDC
site_description: Leakage-aware climate and data-center forecasting benchmarks
site_url: https://hai-qq.github.io/climadc/
repo_url: https://github.com/Hai-qq/climadc
repo_name: Hai-qq/climadc
strict: true
exclude_docs: |
  superpowers/
theme:
  name: material
  language: en
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Time semantics: concepts/time-semantics.md
  - 简体中文:
      - 首页: zh-CN/index.md
      - 快速开始: zh-CN/quickstart.md
      - 时间语义: zh-CN/concepts/time-semantics.md
