site_name: ClimaDC
site_description: Leakage-aware climate and data-center forecasting benchmarks
site_url: https://hai-qq.github.io/climadc/
repo_url: https://github.com/Hai-qq/climadc
repo_name: Hai-qq/climadc
strict: true
exclude_docs: |
  superpowers/
theme:
  name: material
  language: en
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Time semantics: concepts/time-semantics.md
      - Engineering inputs: concepts/engineering-inputs.md
      - Engineering replay kernel: concepts/replay-kernel.md
      - Replay robustness suites: concepts/robustness-suites.md
      - Great Britain reference replay: concepts/reference-replay.md
      - Read-only integrations: concepts/read-only-integrations.md
  - Design:
      - v0.2 engineering replay: design/v0.2-engineering-replay.md
  - 简体中文:
      - 首页: zh-CN/index.md
      - 快速开始: zh-CN/quickstart.md
      - 时间语义: zh-CN/concepts/time-semantics.md
      - 工程输入契约: zh-CN/concepts/engineering-inputs.md
      - 工程回放内核: zh-CN/concepts/replay-kernel.md
      - 回放稳健性套件: zh-CN/concepts/robustness-suites.md
      - 英国参考回放: zh-CN/concepts/reference-replay.md
      - 只读生态适配器: zh-CN/concepts/read-only-integrations.md
      - v0.2 工程回放设计: zh-CN/design/v0.2-engineering-replay.md
