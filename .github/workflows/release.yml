name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.release-validation.outputs.verified }}
      package-version: ${{ steps.release-validation.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python scripts/validate_release.py
          --tag "$RELEASE_TAG"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Validate built distributions
        id: release-validation
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python scripts/validate_release.py
          --tag "$RELEASE_TAG"
          --dist dist
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      needs.build.outputs.verified == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/climadc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
