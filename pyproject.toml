[build-system]
requires = ["hatchling>=1.27,<1.33"]
build-backend = "hatchling.build"

[project]
name = "climadc"
version = "0.3.0a1"
description = "Climate-aware forecasting and benchmarking for data centers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Gao Qing"}]
dependencies = [
  "jinja2>=3.1.6,<4",
  "numpy>=1.26,<2.4",
  "pandas>=2.1,<3",
  "pint>=0.24.4,<1",
  "pyarrow>=23.0.1,<26",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11.4,<2",
  "typer>=0.27,<1",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4,<5"]
xarray = ["xarray>=2024.1"]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<1.33",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pandas-stubs>=2.3,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5",
  "ruff>=0.6",
  "twine>=7,<8",
  "types-PyYAML>=6",
]
docs = ["mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.27,<2"]

[project.scripts]
climadc = "climadc.cli.app:main"

[project.urls]
Documentation = "https://hai-qq.github.io/climadc/"
Issues = "https://github.com/Hai-qq/climadc/issues"
Repository = "https://github.com/Hai-qq/climadc"

[tool.hatch.build.targets.wheel]
packages = ["src/climadc"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.cache/**",
  "/.coverage",
  "/.coverage.*",
  "/.hypothesis/**",
  "/.mypy_cache/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/.superpowers/**",
  "/.venv/**",
  "/.worktrees/**",
  "/**/__pycache__/**",
  "/**/*.egg-info/**",
  "/**/*.py[cod]",
  "/artifacts/**",
  "/build/**",
  "/data/raw/**",
  "/dist/**",
  "/docs/superpowers/**",
  "/htmlcov/**",
  "/runs/**",
  "/site/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["network: requires network access", "lightgbm: requires LightGBM"]

[tool.ruff]
extend-exclude = ["docs/superpowers"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["climadc"]
# Pandas stub releases legitimately make compatibility casts alternate between
# necessary and redundant. Keep those casts portable across the supported 2.x line.
warn_redundant_casts = false
