study_id: weatherdc-kasetsart-small-reference
horizon: 4h
climate:
  path: ../.cache/climadc/weatherdc-small/climate.csv
  format: csv
  timezone: UTC
  card: ../.cache/climadc/weatherdc-small/climate-card.yaml
  column_map: {}
telemetry:
  path: ../.cache/climadc/weatherdc-small/telemetry.csv
  format: csv
  timezone: UTC
  card: ../.cache/climadc/weatherdc-small/telemetry-card.yaml
  column_map: {}
workload:
  path: ../.cache/climadc/weatherdc-small/workload.csv
  format: csv
  timezone: UTC
  card: ../.cache/climadc/weatherdc-small/workload-card.yaml
  column_map: {}
backtest:
  strategy: blocked
  min_train: 28
  calibration_size: 8
  test_size: 8
  step: 8
models:
  - kind: persistence
    model_id: persistence
    params:
      target: cooling_power
  - kind: seasonal
    model_id: seasonal
    params:
      target: cooling_power
      period: 24h
  - kind: linear
    model_id: calendar-linear
    params:
      target: cooling_power
      features: [hour, dayofweek, elapsed_hours]
decision:
  enabled: true
  flexible_fraction: 0.5
  max_shift_multiplier: 2.0
  peak_penalty: 4.0
  risk_penalty: 0.25
extensions:
  weatherdc_reference:
    scope: offline_small_fixture_only
    target: cooling_power
    model_id: weatherdc
    algorithm: ordinary_least_squares
    features: [temp, humid, solar]
    implementation: examples/weatherdc_kasetsart/run.py
    training_boundary: available_at <= common_origin
    test_actuals_boundary: post-hoc evaluation only
    persistence:
      model_id: weatherdc-persistence
      algorithm: last_observation
      boundary: event_time <= common_origin and available_at <= common_origin
output_dir: ../runs/weatherdc-small
